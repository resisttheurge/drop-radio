on:
  workflow_call:
    inputs:
      app:
        description: 'The name of the application to build with Nx'
        required: true
        type: string
      image:
        description: 'The name of the Docker image to build and push'
        required: true
        type: string
      context:
        description: 'The path to the Docker build context'
        required: true
        type: string
      nx-build-target:
        description: 'The Nx build target to use for building the application'
        required: false
        type: string
        default: 'build'
      nx-build-args:
        description: 'Additional build arguments to pass to the NX build command'
        required: false
        type: string

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      # Cache node_modules
      - name: Setup Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: ^24.14.0

      - run: npm ci --legacy-peer-deps

      - name: Build the ${{ inputs.app }} application
        run: npx nx ${{ inputs.nx-build-target }} ${{ inputs.app }} ${{ inputs.nx-build-args }}

      - name: Generate docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/resisttheurge/${{ inputs.image }}
          # generate Docker tags based on the following events/attributes
          tags: |
            latest
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ inputs.app }} image to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ${{ inputs.context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
